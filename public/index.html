<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pro-Escala</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card {
    background: #1e293b; border-radius: 12px; padding: 32px;
    width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; color: #cbd5e1; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  input:focus, select:focus { outline: 2px solid #6366f1; border-color: transparent; }
  button {
    padding: 10px 16px; border: none; border-radius: 8px;
    background: #6366f1; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4f46e5; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.secundario { background: #334155; }
  button.secundario:hover { background: #475569; }
  button.perigo { background: #7f1d1d; }
  button.perigo:hover { background: #991b1b; }
  button.full { width: 100%; }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 8px; }
  .msg.erro { background: #7f1d1d33; color: #fca5a5; }
  .msg.ok { background: #14532d33; color: #86efac; }
  .toggle { margin-top: 18px; text-align: center; font-size: 13px; color: #94a3b8; }
  .toggle a { color: #818cf8; cursor: pointer; text-decoration: none; }

  /* Shell logado */
  header.topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: #1e293b; border-bottom: 1px solid #334155;
  }
  header.topo .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  header.topo .usuario-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #94a3b8; }
  .role-badge { background: #334155; padding: 2px 9px; border-radius: 999px; font-size: 11px; color: #cbd5e1; }
  main.conteudo { padding: 24px; max-width: 1000px; margin: 0 auto; }
  .cabecalho-lista { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .cabecalho-lista h2 { margin: 0; font-size: 19px; }
  input#busca { max-width: 240px; }
  .linha-setores { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -6px 0 16px; }
  .linha-setores-label { font-size: 12px; color: #64748b; }
  .linha-setores-vazio { font-size: 12.5px; color: #64748b; font-style: italic; }
  .setor-chip { background: #334155; color: #cbd5e1; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; }

  nav.abas { display: flex; gap: 4px; padding: 0 24px; background: #1e293b; border-bottom: 1px solid #334155; }
  nav.abas .aba {
    background: transparent; color: #94a3b8; border-radius: 0; padding: 12px 16px;
    font-weight: 500; border-bottom: 2px solid transparent;
  }
  nav.abas .aba:hover { background: #24324a; color: #e2e8f0; }
  nav.abas .aba.ativa { color: #818cf8; border-bottom-color: #818cf8; }

  .dropzone {
    border: 2px dashed #334155; border-radius: 10px; padding: 32px; text-align: center;
    color: #94a3b8; cursor: pointer; margin-bottom: 18px;
  }
  .dropzone:hover { border-color: #6366f1; color: #cbd5e1; }
  .dropzone input { display: none; }
  .progresso-ocr { background: #334155; border-radius: 999px; height: 8px; overflow: hidden; margin: 12px 0; }
  .progresso-ocr-barra { background: #6366f1; height: 100%; transition: width .2s; }
  textarea.texto-ocr {
    width: 100%; min-height: 140px; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12.5px; resize: vertical;
  }
  table.tabela-revisao input, table.tabela-revisao select { padding: 6px 8px; font-size: 12.5px; }
  table.tabela-revisao td { padding: 6px 8px; }
  .aviso-modo {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px;
    font-size: 12.5px; color: #94a3b8; margin-bottom: 18px;
  }

  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid #293548; }
  th { color: #94a3b8; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #24324a; }
  td.acoes { display: flex; gap: 8px; }
  td.acoes button { padding: 6px 10px; font-size: 12.5px; }
  .status-tag { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; }
  .status-tag.ativo { background: #14532d55; color: #86efac; }
  .status-tag.bloqueado { background: #7f1d1d55; color: #fca5a5; }
  .vazio { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal { background: #1e293b; border-radius: 12px; padding: 26px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 18px; font-size: 18px; }
  .modal .rodape { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .campo-senha-hint { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
const API = "/api";
let modo = "login"; // login | setup
let usuarioAtual = null;
let listaUsuarios = [];
let listaSetores = [];
let listaTiposEscala = [];
let editandoId = null;

function getToken() { return localStorage.getItem("pe_token"); }
function setToken(t) { t ? localStorage.setItem("pe_token", t) : localStorage.removeItem("pe_token"); }

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  const token = getToken();
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.erro || "Erro desconhecido");
  return data;
}

const app = document.getElementById("app");

async function iniciar() {
  const token = getToken();
  if (token) {
    try {
      const { usuario } = await api("/me");
      usuarioAtual = usuario;
      await renderShell();
      return;
    } catch { setToken(null); }
  }
  renderAuth();
}

/* ---------- Login / Setup ---------- */
function renderAuth(erro) {
  const isSetup = modo === "setup";
  app.innerHTML = `
    <div class="center-screen"><div class="card">
      <h1>Pro-Escala</h1>
      <p class="sub">${isSetup ? "Configuração inicial — criar conta admin" : "Entrar no sistema"}</p>
      ${isSetup ? `<label>Nome</label><input id="nome" autocomplete="name" />` : ""}
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" />
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="${isSetup ? "new-password" : "current-password"}" />
      <button class="full" style="margin-top:20px" id="btn">${isSetup ? "Criar admin" : "Entrar"}</button>
      ${erro ? `<div class="msg erro">${erro}</div>` : ""}
      <div class="toggle">
        ${isSetup
          ? `Já tem conta? <a id="toggle">Entrar</a>`
          : `Primeira vez configurando o sistema? <a id="toggle">Criar admin</a>`}
      </div>
    </div></div>
  `;
  document.getElementById("toggle").onclick = () => { modo = isSetup ? "login" : "setup"; renderAuth(); };
  document.getElementById("btn").onclick = submitAuth;
}

async function submitAuth() {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  try {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const body = { email, senha };
    if (modo === "setup") body.nome = document.getElementById("nome").value;
    const { token, usuario } = await api(modo === "setup" ? "/setup" : "/login", {
      method: "POST", body: JSON.stringify(body),
    });
    setToken(token);
    usuarioAtual = usuario;
    await renderShell();
  } catch (e) {
    renderAuth(e.message);
  } finally {
    if (document.getElementById("btn")) btn.disabled = false;
  }
}

async function sair() {
  await api("/logout", { method: "POST" }).catch(() => {});
  setToken(null);
  usuarioAtual = null;
  modo = "login";
  renderAuth();
}

/* ---------- Shell logado ---------- */
let telaAtual = "funcionarios";

async function renderShell() {
  const podeGerenciarFuncionarios = ["admin", "rh", "gestor_setor"].includes(usuarioAtual.role);

  app.innerHTML = `
    <header class="topo">
      <div class="marca">📋 Pro-Escala</div>
      <div class="usuario-info">
        <span>${usuarioAtual.nome}</span>
        <span class="role-badge">${usuarioAtual.role}</span>
        <button class="secundario" id="sair">Sair</button>
      </div>
    </header>
    ${podeGerenciarFuncionarios ? `
    <nav class="abas">
      <button class="aba ${telaAtual === "funcionarios" ? "ativa" : ""}" data-aba="funcionarios">Funcionários</button>
      <button class="aba ${telaAtual === "importar" ? "ativa" : ""}" data-aba="importar">Importar Escala</button>
    </nav>` : ""}
    <main class="conteudo" id="conteudo"></main>
  `;
  document.getElementById("sair").onclick = sair;

  if (podeGerenciarFuncionarios) {
    document.querySelectorAll(".aba").forEach(b => {
      b.onclick = () => { telaAtual = b.dataset.aba; renderShell(); };
    });
    if (telaAtual === "importar") await renderImportarEscala();
    else await renderFuncionarios();
  } else {
    document.getElementById("conteudo").innerHTML = `
      <div class="vazio">Você está logado como <strong>${usuarioAtual.role}</strong>. Ainda não há uma tela específica para o seu perfil — em breve.</div>
    `;
  }
}

/* ---------- Tela de Funcionários ---------- */
async function carregarDados() {
  const [u, s, t] = await Promise.all([api("/usuarios"), api("/setores"), api("/tipos-escala")]);
  listaUsuarios = u.usuarios;
  listaSetores = s.setores;
  listaTiposEscala = t.tiposEscala;
}

async function renderFuncionarios(filtro = "") {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = `<div class="vazio">Carregando...</div>`;
  try {
    await carregarDados();
  } catch (e) {
    conteudo.innerHTML = `<div class="msg erro">Erro ao carregar: ${e.message}</div>`;
    return;
  }

  const podeCriarSetor = usuarioAtual.role === "admin";
  const termo = filtro.trim().toLowerCase();
  const filtrados = listaUsuarios.filter(u =>
    !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
  );

  const setorNome = (id) => listaSetores.find(s => s.id === id)?.nome || "—";
  const escalaNome = (id) => listaTiposEscala.find(t => t.id === id)?.nome || "—";

  conteudo.innerHTML = `
    <div class="cabecalho-lista">
      <h2>Funcionários (${listaUsuarios.length})</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="busca" placeholder="Buscar por nome ou e-mail" value="${filtro}" />
        ${podeCriarSetor ? `<button class="secundario" id="btn-novo-setor">+ Setor</button>` : ""}
        <button id="btn-novo-func">+ Funcionário</button>
      </div>
    </div>
    <div class="linha-setores">
      <span class="linha-setores-label">Setores:</span>
      ${listaSetores.length === 0
        ? `<span class="linha-setores-vazio">nenhum setor cadastrado ainda</span>`
        : listaSetores.map(s => `<span class="setor-chip">${s.nome}</span>`).join("")}
    </div>
    <div id="feedback-setor"></div>
    ${filtrados.length === 0 ? `<div class="vazio">Nenhum funcionário encontrado.</div>` : `
    <table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Setor</th><th>Escala</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${filtrados.map(u => `
          <tr>
            <td>${u.nome}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>${setorNome(u.setorId)}</td>
            <td>${escalaNome(u.tipoEscalaId)}</td>
            <td><span class="status-tag ${u.status}">${u.status}</span></td>
            <td class="acoes">
              <button class="secundario" data-editar="${u.id}">Editar</button>
              ${usuarioAtual.role === "admin" && u.id !== usuarioAtual.id ? `<button class="perigo" data-excluir="${u.id}">Excluir</button>` : ""}
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>`}
  `;

  document.getElementById("busca").oninput = (e) => renderFuncionariosLocal(e.target.value);
  document.getElementById("btn-novo-func").onclick = () => abrirModalFuncionario(null);
  const btnSetor = document.getElementById("btn-novo-setor");
  if (btnSetor) btnSetor.onclick = criarSetorPrompt;

  conteudo.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => abrirModalFuncionario(Number(b.dataset.editar));
  });
  conteudo.querySelectorAll("[data-excluir]").forEach(b => {
    b.onclick = () => excluirFuncionario(Number(b.dataset.excluir));
  });
}

// re-render so filtragem sem bater na API de novo
function renderFuncionariosLocal(filtro) {
  const termo = filtro.trim().toLowerCase();
  const conteudo = document.getElementById("conteudo");
  const filtrados = listaUsuarios.filter(u =>
    !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
  );
  const setorNome = (id) => listaSetores.find(s => s.id === id)?.nome || "—";
  const escalaNome = (id) => listaTiposEscala.find(t => t.id === id)?.nome || "—";
  const tbody = conteudo.querySelector("tbody");
  const tabela = conteudo.querySelector("table");
  const h2 = conteudo.querySelector("h2");
  if (h2) h2.textContent = `Funcionários (${listaUsuarios.length})`;

  if (filtrados.length === 0) {
    if (tabela) tabela.outerHTML = `<div class="vazio">Nenhum funcionário encontrado.</div>`;
    return;
  }
  if (!tabela) { renderFuncionarios(filtro); return; }
  tbody.innerHTML = filtrados.map(u => `
    <tr>
      <td>${u.nome}</td>
      <td>${u.email}</td>
      <td>${u.role}</td>
      <td>${setorNome(u.setorId)}</td>
      <td>${escalaNome(u.tipoEscalaId)}</td>
      <td><span class="status-tag ${u.status}">${u.status}</span></td>
      <td class="acoes">
        <button class="secundario" data-editar="${u.id}">Editar</button>
        ${usuarioAtual.role === "admin" && u.id !== usuarioAtual.id ? `<button class="perigo" data-excluir="${u.id}">Excluir</button>` : ""}
      </td>
    </tr>
  `).join("");
  conteudo.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => abrirModalFuncionario(Number(b.dataset.editar));
  });
  conteudo.querySelectorAll("[data-excluir]").forEach(b => {
    b.onclick = () => excluirFuncionario(Number(b.dataset.excluir));
  });
}

async function criarSetorPrompt() {
  const nome = prompt("Nome do novo setor:");
  if (!nome || !nome.trim()) return;
  try {
    await api("/setores", { method: "POST", body: JSON.stringify({ nome: nome.trim() }) });
    const filtroAtual = document.getElementById("busca") ? document.getElementById("busca").value : "";
    await renderFuncionarios(filtroAtual);
    const fb = document.getElementById("feedback-setor");
    if (fb) {
      fb.innerHTML = `<div class="msg ok">Setor "${nome.trim()}" criado.</div>`;
      setTimeout(() => { if (fb) fb.innerHTML = ""; }, 3000);
    }
  } catch (e) {
    const fb = document.getElementById("feedback-setor");
    if (fb) fb.innerHTML = `<div class="msg erro">Erro ao criar setor: ${e.message}</div>`;
    else alert("Erro ao criar setor: " + e.message);
  }
}

function abrirModalFuncionario(id) {
  editandoId = id;
  const editando = id ? listaUsuarios.find(u => u.id === id) : null;
  const souAdmin = usuarioAtual.role === "admin";
  const souGestorSetor = usuarioAtual.role === "gestor_setor";

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${editando ? "Editar funcionário" : "Novo funcionário"}</h3>
      <label>Nome</label>
      <input id="m-nome" value="${editando ? editando.nome.replace(/"/g,'&quot;') : ""}" />
      <label>E-mail</label>
      <input id="m-email" type="email" value="${editando ? editando.email : ""}" />
      ${!editando ? `<label>Senha</label><input id="m-senha" type="password" />` : `
        <label>Nova senha (opcional)</label><input id="m-senha" type="password" placeholder="deixe em branco para manter" />
      `}
      ${souAdmin ? `
        <label>Papel</label>
        <select id="m-role">
          ${["admin","rh","gestor_setor","usuario"].map(r => `<option value="${r}" ${editando?.role === r ? "selected" : ""}>${r}</option>`).join("")}
        </select>
      ` : ""}
      ${!souGestorSetor ? `
        <label>Setor</label>
        <select id="m-setor">
          <option value="">— nenhum —</option>
          ${listaSetores.map(s => `<option value="${s.id}" ${editando?.setorId === s.id ? "selected" : ""}>${s.nome}</option>`).join("")}
        </select>
      ` : ""}
      <label>Padrão de escala</label>
      <select id="m-tipo-escala">
        <option value="">— não definido —</option>
        ${listaTiposEscala.map(t => `<option value="${t.id}" ${editando?.tipoEscalaId === t.id ? "selected" : ""}>${t.nome}</option>`).join("")}
      </select>
      ${editando ? `
        <label>Status</label>
        <select id="m-status">
          <option value="ativo" ${editando.status === "ativo" ? "selected" : ""}>Ativo</option>
          <option value="bloqueado" ${editando.status === "bloqueado" ? "selected" : ""}>Bloqueado</option>
        </select>
      ` : ""}
      <div id="m-erro"></div>
      <div class="rodape">
        <button class="secundario" id="m-cancelar">Cancelar</button>
        <button id="m-salvar">${editando ? "Salvar" : "Criar"}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.getElementById("m-cancelar").onclick = () => overlay.remove();
  document.getElementById("m-salvar").onclick = () => salvarFuncionario(overlay, editando);
}

async function salvarFuncionario(overlay, editando) {
  const btn = document.getElementById("m-salvar");
  const erroEl = document.getElementById("m-erro");
  btn.disabled = true;
  erroEl.innerHTML = "";
  try {
    const nome = document.getElementById("m-nome").value.trim();
    const email = document.getElementById("m-email").value.trim();
    const senhaEl = document.getElementById("m-senha");
    const senha = senhaEl ? senhaEl.value : "";
    const roleEl = document.getElementById("m-role");
    const setorEl = document.getElementById("m-setor");
    const tipoEscalaEl = document.getElementById("m-tipo-escala");
    const statusEl = document.getElementById("m-status");

    const body = { nome, email };
    if (senha) body.senha = senha;
    if (roleEl) body.role = roleEl.value;
    if (setorEl) body.setorId = setorEl.value ? Number(setorEl.value) : null;
    if (tipoEscalaEl) body.tipoEscalaId = tipoEscalaEl.value ? Number(tipoEscalaEl.value) : null;
    if (statusEl) body.status = statusEl.value;

    if (editando) {
      await api(`/usuarios/${editando.id}`, { method: "PUT", body: JSON.stringify(body) });
    } else {
      if (!senha || senha.length < 6) throw new Error("Senha deve ter no mínimo 6 caracteres.");
      await api("/usuarios", { method: "POST", body: JSON.stringify(body) });
    }
    overlay.remove();
    await renderFuncionarios();
  } catch (e) {
    erroEl.innerHTML = `<div class="msg erro">${e.message}</div>`;
  } finally {
    if (document.getElementById("m-salvar")) btn.disabled = false;
  }
}

async function excluirFuncionario(id) {
  const alvo = listaUsuarios.find(u => u.id === id);
  if (!confirm(`Excluir ${alvo ? alvo.nome : "este funcionário"}? Essa ação não pode ser desfeita.`)) return;
  try {
    await api(`/usuarios/${id}`, { method: "DELETE" });
    await renderFuncionarios();
  } catch (e) {
    alert("Erro ao excluir: " + e.message);
  }
}

/* ---------- Importar Escala (imagem) ---------- */
// Camada de provedores: hoje so' OCR gratuito. Quando a licenca for vendida/ativada,
// troca PROVEDOR_ATIVO para "ia" e implementa extrairComIA (chamada a uma API de visao).
// O resto da tela (revisao/edicao/importacao) nao muda.
const PROVEDORES_IMPORTACAO = {
  ocr: { rotulo: "OCR local (gratuito)", extrair: extrairComOCR },
  ia: { rotulo: "IA com visão (em breve)", extrair: extrairComIA },
};
let PROVEDOR_ATIVO = "ocr";

let registrosRevisao = [];
let textoOcrBruto = "";

async function extrairComOCR(file, onProgress) {
  if (typeof Tesseract === "undefined") throw new Error("Biblioteca de OCR não carregou. Verifique sua conexão e recarregue a página.");
  const { data } = await Tesseract.recognize(file, "por", {
    logger: (m) => { if (m.status === "recognizing text" && onProgress) onProgress(Math.round(m.progress * 100)); },
  });
  return data.text;
}

// Parser ingenuo: tenta achar data (dd/mm/aaaa ou aaaa-mm-dd) e horarios (HH:MM) em cada linha.
// O resto da linha vira o "nome detectado", que o usuario ajusta manualmente na tabela de revisao.
// Extrai só os nomes de cada linha do texto OCR (ignora linhas que parecem
// cabeçalho/numeros/codigo de turno, mantendo o que parece nome de pessoa).
function linhasParaNomes(texto) {
  return texto
    .split("\n")
    .map(l => l.trim())
    .filter(Boolean)
    .map(l => l.replace(/[|\[\]]+/g, " ").replace(/\s+/g, " ").trim())
    .filter(l => {
      if (l.length < 2) return false;
      const letras = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
      const digitos = (l.match(/[0-9]/g) || []).length;
      return letras > digitos; // linha "de nome" tem mais letra que digito; descarta linhas de grade/horario
    });
}

function encontrarUsuarioPorNome(nomeDetectado) {
  if (!nomeDetectado) return "";
  const termo = nomeDetectado.toLowerCase();
  const achado = listaUsuarios.find(u => termo.includes(u.nome.toLowerCase()) || u.nome.toLowerCase().includes(termo));
  return achado ? achado.id : "";
}

function slug(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "") || "func";
}

function gerarEmailTemp(nome) {
  const aleatorio = Math.random().toString(36).slice(2, 7);
  return `${slug(nome)}.${aleatorio}@pendente.pro-escala`;
}
function gerarSenhaTemp() {
  return Math.random().toString(36).slice(2, 10) + "Aa1!";
}

async function renderImportarEscala() {
  const conteudo = document.getElementById("conteudo");
  if (!listaUsuarios.length) {
    try { await carregarDados(); } catch (e) {
      conteudo.innerHTML = `<div class="msg erro">Erro ao carregar funcionários: ${e.message}</div>`;
      return;
    }
  }

  conteudo.innerHTML = `
    <div class="cabecalho-lista"><h2>Importar Escala por Imagem</h2></div>
    <div class="aviso-modo">
      Modo atual: <strong>${PROVEDORES_IMPORTACAO[PROVEDOR_ATIVO].rotulo}</strong> — a leitura fica só na coluna de nomes
      (horário de grade em foto costuma vir embaralhado). Depois de reconhecer os nomes, você vincula cada um a um
      funcionário e define o padrão de escala dele. Os horários da semana são gerados a partir desse padrão.
    </div>
    <div class="dropzone" id="dropzone">
      <div id="dropzone-texto">📷 Clique para escolher uma foto ou print da escala (JPG, PNG)</div>
      <input type="file" id="input-imagem" accept="image/*" />
    </div>
    <div id="area-progresso"></div>
    <div id="area-texto-bruto"></div>
    <div id="area-revisao"></div>
  `;

  const dropzone = document.getElementById("dropzone");
  const inputImagem = document.getElementById("input-imagem");
  dropzone.onclick = () => inputImagem.click();
  inputImagem.onchange = () => { if (inputImagem.files[0]) processarImagem(inputImagem.files[0]); };
}

async function processarImagem(file) {
  const areaProgresso = document.getElementById("area-progresso");
  const dzTexto = document.getElementById("dropzone-texto");
  dzTexto.textContent = `Processando "${file.name}"...`;
  areaProgresso.innerHTML = `<div class="progresso-ocr"><div class="progresso-ocr-barra" id="barra-progresso" style="width:0%"></div></div>`;

  try {
    const texto = await PROVEDORES_IMPORTACAO[PROVEDOR_ATIVO].extrair(file, (pct) => {
      const barra = document.getElementById("barra-progresso");
      if (barra) barra.style.width = pct + "%";
    });
    textoOcrBruto = texto;
    dzTexto.textContent = "📷 Clique para escolher outra imagem";
    areaProgresso.innerHTML = "";
    renderTextoBruto();
  } catch (e) {
    dzTexto.textContent = "📷 Clique para escolher uma foto ou print da escala (JPG, PNG)";
    areaProgresso.innerHTML = `<div class="msg erro">${e.message}</div>`;
  }
}

function renderTextoBruto() {
  const area = document.getElementById("area-texto-bruto");
  area.innerHTML = `
    <label>Texto lido da imagem (edite antes de extrair os nomes, se precisar — apague linhas de grade/números)</label>
    <textarea class="texto-ocr" id="texto-ocr">${textoOcrBruto}</textarea>
    <div style="margin-top:10px;"><button id="btn-gerar-linhas">Extrair nomes</button></div>
  `;
  document.getElementById("btn-gerar-linhas").onclick = () => {
    const texto = document.getElementById("texto-ocr").value;
    const nomes = linhasParaNomes(texto);
    registrosRevisao = nomes.map(n => ({
      nomeDetectado: n,
      usuarioId: encontrarUsuarioPorNome(n),
      setorId: usuarioAtual.role === "gestor_setor" ? usuarioAtual.setorId : (listaSetores[0]?.id || ""),
      tipoEscalaId: "",
    }));
    if (!registrosRevisao.length) registrosRevisao = [{ nomeDetectado: "", usuarioId: "", setorId: "", tipoEscalaId: "" }];
    renderTabelaRevisao();
  };
}

function renderTabelaRevisao() {
  const area = document.getElementById("area-revisao");
  const souGestorSetor = usuarioAtual.role === "gestor_setor";
  const opcoesUsuarios = (r) => {
    const jaEscolhidos = registrosRevisao.filter(x => x !== r).map(x => x.usuarioId).filter(Boolean);
    return listaUsuarios
      .filter(u => !jaEscolhidos.includes(u.id))
      .map(u => `<option value="${u.id}">${u.nome}</option>`).join("");
  };
  const opcoesSetores = listaSetores.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");
  const opcoesTiposEscala = listaTiposEscala.map(t => `<option value="${t.id}">${t.nome}</option>`).join("");

  area.innerHTML = `
    <div class="cabecalho-lista" style="margin-top:24px;">
      <h2 style="font-size:16px;">Revisar antes de importar (${registrosRevisao.length} nomes)</h2>
      <button class="secundario" id="btn-add-linha">+ Linha</button>
    </div>
    <table class="tabela-revisao">
      <thead><tr><th>Detectado</th><th>Vincular a</th><th>Setor (se novo)</th><th>Padrão de escala</th><th></th></tr></thead>
      <tbody id="tbody-revisao"></tbody>
    </table>
    <div id="feedback-import" style="margin-top:14px;"></div>
    <div style="margin-top:14px;"><button id="btn-importar">Confirmar funcionários</button></div>
  `;

  const tbody = document.getElementById("tbody-revisao");
  registrosRevisao.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.nomeDetectado || "—"}</td>
      <td>
        <select data-campo="usuarioId" data-i="${i}">
          <option value="">— criar novo funcionário —</option>
          ${opcoesUsuarios(r)}
        </select>
      </td>
      <td>
        <select data-campo="setorId" data-i="${i}" ${souGestorSetor ? "disabled" : ""} style="${r.usuarioId ? "visibility:hidden" : ""}">
          <option value="">selecione</option>
          ${opcoesSetores}
        </select>
      </td>
      <td>
        <select data-campo="tipoEscalaId" data-i="${i}">
          <option value="">— não definido —</option>
          ${opcoesTiposEscala}
        </select>
      </td>
      <td><button class="perigo" data-remover="${i}">×</button></td>
    `;
    tbody.appendChild(tr);
    tr.querySelector(`select[data-campo="usuarioId"]`).value = r.usuarioId || "";
    tr.querySelector(`select[data-campo="setorId"]`).value = r.setorId || "";
    tr.querySelector(`select[data-campo="tipoEscalaId"]`).value = r.tipoEscalaId || "";
  });

  tbody.querySelectorAll("[data-campo]").forEach(el => {
    el.onchange = () => {
      registrosRevisao[Number(el.dataset.i)][el.dataset.campo] = el.value;
      if (el.dataset.campo === "usuarioId") renderTabelaRevisao(); // re-render p/ atualizar opcoes disponiveis e visibilidade do setor
    };
  });
  tbody.querySelectorAll("[data-remover]").forEach(b => {
    b.onclick = () => { registrosRevisao.splice(Number(b.dataset.remover), 1); renderTabelaRevisao(); };
  });
  document.getElementById("btn-add-linha").onclick = () => {
    registrosRevisao.push({ nomeDetectado: "", usuarioId: "", setorId: souGestorSetor ? usuarioAtual.setorId : "", tipoEscalaId: "" });
    renderTabelaRevisao();
  };
  document.getElementById("btn-importar").onclick = confirmarImportacao;
}

async function confirmarImportacao() {
  const btn = document.getElementById("btn-importar");
  const fb = document.getElementById("feedback-import");
  btn.disabled = true;
  fb.innerHTML = "";

  const validos = registrosRevisao.filter(r => r.nomeDetectado && (r.usuarioId || r.setorId));
  if (!validos.length) {
    fb.innerHTML = `<div class="msg erro">Preencha ao menos um nome com funcionário ou setor definido.</div>`;
    btn.disabled = false;
    return;
  }

  let criados = 0, atualizados = 0;
  const falhas = [];

  for (const r of validos) {
    try {
      if (r.usuarioId) {
        if (r.tipoEscalaId) {
          await api(`/usuarios/${r.usuarioId}`, { method: "PUT", body: JSON.stringify({ tipoEscalaId: Number(r.tipoEscalaId) }) });
          atualizados++;
        }
      } else {
        await api("/usuarios", { method: "POST", body: JSON.stringify({
          nome: r.nomeDetectado,
          email: gerarEmailTemp(r.nomeDetectado),
          senha: gerarSenhaTemp(),
          role: "usuario",
          setorId: Number(r.setorId),
          tipoEscalaId: r.tipoEscalaId ? Number(r.tipoEscalaId) : null,
        }) });
        criados++;
      }
    } catch (e) {
      falhas.push(`${r.nomeDetectado}: ${e.message}`);
    }
  }

  let html = "";
  if (criados) html += `<div class="msg ok">${criados} funcionário(s) novo(s) criado(s).</div>`;
  if (atualizados) html += `<div class="msg ok">${atualizados} padrão(ões) de escala atualizado(s).</div>`;
  if (falhas.length) html += `<div class="msg erro">${falhas.length} falha(s): ${falhas.join(", ")}</div>`;
  fb.innerHTML = html;
  btn.disabled = false;

  await carregarDados();
}
