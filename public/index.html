<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pro-Escala</title>
<style>
  :root { --cor-primaria: var(--cor-primaria); --cor-primaria-hover: var(--cor-primaria-hover); --cor-primaria-clara: var(--cor-primaria-clara); }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card {
    background: #1e293b; border-radius: 12px; padding: 32px;
    width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; color: #cbd5e1; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  input:focus, select:focus { outline: 2px solid var(--cor-primaria); border-color: transparent; }
  button {
    padding: 10px 16px; border: none; border-radius: 8px;
    background: var(--cor-primaria); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--cor-primaria-hover); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.secundario { background: #334155; }
  button.secundario:hover { background: #475569; }
  button.perigo { background: #7f1d1d; }
  button.perigo:hover { background: #991b1b; }
  button.full { width: 100%; }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 8px; }
  .msg.erro { background: #7f1d1d33; color: #fca5a5; }
  .msg.ok { background: #14532d33; color: #86efac; }
  .toggle { margin-top: 18px; text-align: center; font-size: 13px; color: #94a3b8; }
  .toggle a { color: var(--cor-primaria-clara); cursor: pointer; text-decoration: none; }

  /* Shell logado */
  header.topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: #1e293b; border-bottom: 1px solid #334155;
  }
  header.topo .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  header.topo .usuario-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #94a3b8; }
  .role-badge { background: #334155; padding: 2px 9px; border-radius: 999px; font-size: 11px; color: #cbd5e1; }
  main.conteudo { padding: 24px; max-width: 1000px; margin: 0 auto; }
  .cabecalho-lista { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .cabecalho-lista h2 { margin: 0; font-size: 19px; }
  input#busca { max-width: 240px; }
  .linha-setores { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -6px 0 16px; }
  .linha-setores-label { font-size: 12px; color: #64748b; }
  .linha-setores-vazio { font-size: 12.5px; color: #64748b; font-style: italic; }
  .setor-chip { background: #334155; color: #cbd5e1; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; }

  nav.abas { display: flex; gap: 4px; padding: 0 24px; background: #1e293b; border-bottom: 1px solid #334155; }
  nav.abas .aba {
    background: transparent; color: #94a3b8; border-radius: 0; padding: 12px 16px;
    font-weight: 500; border-bottom: 2px solid transparent;
  }
  nav.abas .aba:hover { background: #24324a; color: #e2e8f0; }
  nav.abas .aba.ativa { color: var(--cor-primaria-clara); border-bottom-color: var(--cor-primaria-clara); }

  .dropzone {
    border: 2px dashed #334155; border-radius: 10px; padding: 32px; text-align: center;
    color: #94a3b8; cursor: pointer; margin-bottom: 18px;
  }
  .dropzone:hover { border-color: var(--cor-primaria); color: #cbd5e1; }
  .dropzone input { display: none; }
  .progresso-ocr { background: #334155; border-radius: 999px; height: 8px; overflow: hidden; margin: 12px 0; }
  .progresso-ocr-barra { background: var(--cor-primaria); height: 100%; transition: width .2s; }
  textarea.texto-ocr {
    width: 100%; min-height: 140px; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12.5px; resize: vertical;
  }
  table.tabela-revisao input, table.tabela-revisao select { padding: 6px 8px; font-size: 12.5px; }
  table.tabela-revisao td { padding: 6px 8px; }
  .aviso-modo {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px;
    font-size: 12.5px; color: #94a3b8; margin-bottom: 18px;
  }
  .grade-mapeamento { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 14px 0; }
  .col-mapeamento { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
  .col-mapeamento .amostra { font-size: 11px; color: #64748b; margin-bottom: 6px; word-break: break-word; }
  .col-mapeamento select { width: 100%; }
  .sugestao-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 13px;
  }
  .sugestao-card button { padding: 6px 12px; font-size: 12.5px; }
  .grupo-grade-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .grupo-grade-cabecalho { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .grupo-grade-cabecalho select { max-width: 220px; }
  .grupo-grade-info { font-size: 12px; color: #64748b; }
  .chips-dias { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-dia { background: #334155; padding: 3px 8px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .chip-dia.desconhecido { background: #7f1d1d55; color: #fca5a5; }
  .chip-dia button { background: transparent; border: none; color: inherit; cursor: pointer; padding: 0; font-size: 13px; line-height: 1; }

  .tabela-funcao-dia { border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
  .tabela-funcao-dia th, .tabela-funcao-dia td { border: 1px solid #334155; padding: 5px 8px; text-align: center; }
  .tabela-funcao-dia th.col-funcao, .tabela-funcao-dia td.col-funcao { text-align: left; white-space: normal; max-width: 220px; font-weight: 600; }
  .tabela-funcao-dia thead th { background: #1e293b; color: #94a3b8; }
  .wrapper-tabela-escala { overflow-x: auto; border: 1px solid #334155; border-radius: 8px; }

  @media print {
    body * { visibility: hidden; }
    #area-imprimir-escala, #area-imprimir-escala * { visibility: visible; }
    #area-imprimir-escala { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; }
    .tabela-funcao-dia th, .tabela-funcao-dia td { border-color: #999; color: #000; }
    .tabela-funcao-dia thead th { background: #eee; color: #000; }
  }

  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid #293548; }
  th { color: #94a3b8; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #24324a; }
  td.acoes { display: flex; gap: 8px; }
  td.acoes button { padding: 6px 10px; font-size: 12.5px; }
  .status-tag { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; }
  .status-tag.ativo { background: #14532d55; color: #86efac; }
  .status-tag.bloqueado { background: #7f1d1d55; color: #fca5a5; }
  .vazio { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal { background: #1e293b; border-radius: 12px; padding: 26px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 18px; font-size: 18px; }
  .modal .rodape { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .campo-senha-hint { font-size: 12px; color: #64748b; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API = "/api";
let modo = "login"; // login | setup
let usuarioAtual = null;
let listaUsuarios = [];
let listaSetores = [];
let listaTiposEscala = [];
let editandoId = null;
let appConfig = {};

function escurecerHex(hex, fator = 0.15) {
  const h = hex.replace("#", "");
  const num = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  const r = Math.max(0, Math.floor(((num >> 16) & 255) * (1 - fator)));
  const g = Math.max(0, Math.floor(((num >> 8) & 255) * (1 - fator)));
  const b = Math.max(0, Math.floor((num & 255) * (1 - fator)));
  return `#${[r, g, b].map(x => x.toString(16).padStart(2, "0")).join("")}`;
}

function aplicarConfig() {
  if (appConfig.cor_primaria) {
    document.documentElement.style.setProperty("--cor-primaria", appConfig.cor_primaria);
    document.documentElement.style.setProperty("--cor-primaria-hover", escurecerHex(appConfig.cor_primaria, 0.15));
    document.documentElement.style.setProperty("--cor-primaria-clara", appConfig.cor_primaria);
  }
  if (appConfig.nome_instituicao) document.title = `Pro-Escala — ${appConfig.nome_instituicao}`;
}

async function carregarConfig() {
  try {
    const r = await api("/config");
    appConfig = r.config || {};
    aplicarConfig();
  } catch { /* silencioso: branding e' cosmetico, nao trava o app */ }
}

function getToken() { return localStorage.getItem("pe_token"); }
function setToken(t) { t ? localStorage.setItem("pe_token", t) : localStorage.removeItem("pe_token"); }

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  const token = getToken();
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.erro || "Erro desconhecido");
  return data;
}

const app = document.getElementById("app");

async function iniciar() {
  const token = getToken();
  if (token) {
    try {
      const { usuario } = await api("/me");
      usuarioAtual = usuario;
      await carregarConfig();
      await renderShell();
      return;
    } catch { setToken(null); }
  }
  renderAuth();
}

/* ---------- Login / Setup ---------- */
function renderAuth(erro) {
  const isSetup = modo === "setup";
  app.innerHTML = `
    <div class="center-screen"><div class="card">
      <h1>Pro-Escala</h1>
      <p class="sub">${isSetup ? "Configuração inicial — criar conta admin" : "Entrar no sistema"}</p>
      ${isSetup ? `<label>Nome</label><input id="nome" autocomplete="name" />` : ""}
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" />
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="${isSetup ? "new-password" : "current-password"}" />
      <button class="full" style="margin-top:20px" id="btn">${isSetup ? "Criar admin" : "Entrar"}</button>
      ${erro ? `<div class="msg erro">${erro}</div>` : ""}
      <div class="toggle">
        ${isSetup
          ? `Já tem conta? <a id="toggle">Entrar</a>`
          : `Primeira vez configurando o sistema? <a id="toggle">Criar admin</a>`}
      </div>
    </div></div>
  `;
  document.getElementById("toggle").onclick = () => { modo = isSetup ? "login" : "setup"; renderAuth(); };
  document.getElementById("btn").onclick = submitAuth;
}

async function submitAuth() {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  try {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const body = { email, senha };
    if (modo === "setup") body.nome = document.getElementById("nome").value;
    const { token, usuario } = await api(modo === "setup" ? "/setup" : "/login", {
      method: "POST", body: JSON.stringify(body),
    });
    setToken(token);
    usuarioAtual = usuario;
    await carregarConfig();
    await renderShell();
  } catch (e) {
    renderAuth(e.message);
  } finally {
    if (document.getElementById("btn")) btn.disabled = false;
  }
}

async function sair() {
  await api("/logout", { method: "POST" }).catch(() => {});
  setToken(null);
  usuarioAtual = null;
  modo = "login";
  renderAuth();
}

/* ---------- Shell logado ---------- */
let telaAtual = "funcionarios";

async function renderShell() {
  const podeGerenciarFuncionarios = ["admin", "rh", "gestor_setor"].includes(usuarioAtual.role);
  const souAdmin = usuarioAtual.role === "admin";
  const marcaHtml = appConfig.logo_url
    ? `<img src="${appConfig.logo_url}" alt="logo" style="height:26px;border-radius:4px;object-fit:contain" onerror="this.style.display='none'" />`
    : "📋";

  app.innerHTML = `
    <header class="topo">
      <div class="marca">${marcaHtml} ${appConfig.nome_instituicao || "Pro-Escala"}</div>
      <div class="usuario-info">
        <span>${usuarioAtual.nome}</span>
        <span class="role-badge">${usuarioAtual.role}</span>
        <button class="secundario" id="sair">Sair</button>
      </div>
    </header>
    ${podeGerenciarFuncionarios ? `
    <nav class="abas">
      <button class="aba ${telaAtual === "funcionarios" ? "ativa" : ""}" data-aba="funcionarios">Funcionários</button>
      <button class="aba ${telaAtual === "importar" ? "ativa" : ""}" data-aba="importar">Importar Imagem</button>
      <button class="aba ${telaAtual === "excel" ? "ativa" : ""}" data-aba="excel">Importar Excel</button>
      <button class="aba ${telaAtual === "gerar" ? "ativa" : ""}" data-aba="gerar">Gerar Escala</button>
      <button class="aba ${telaAtual === "visualizar" ? "ativa" : ""}" data-aba="visualizar">Visualizar Escala</button>
      ${souAdmin ? `<button class="aba ${telaAtual === "config" ? "ativa" : ""}" data-aba="config">Configurações</button>` : ""}
    </nav>` : ""}
    <main class="conteudo" id="conteudo"></main>
  `;
  document.getElementById("sair").onclick = sair;

  if (podeGerenciarFuncionarios) {
    document.querySelectorAll(".aba").forEach(b => {
      b.onclick = () => { telaAtual = b.dataset.aba; renderShell(); };
    });
    if (telaAtual === "importar") await renderImportarEscala();
    else if (telaAtual === "excel") await renderImportarExcel();
    else if (telaAtual === "gerar") await renderGerarEscala();
    else if (telaAtual === "visualizar") await renderVisualizarEscala();
    else if (telaAtual === "config" && souAdmin) await renderConfiguracoes();
    else await renderFuncionarios();
  } else {
    document.getElementById("conteudo").innerHTML = `
      <div class="vazio">Você está logado como <strong>${usuarioAtual.role}</strong>. Ainda não há uma tela específica para o seu perfil — em breve.</div>
    `;
  }
}

let listaCodigosPlantao = [];

/* ---------- Tela de Funcionários ---------- */
async function carregarDados() {
  const [u, s, t, c] = await Promise.all([api("/usuarios"), api("/setores"), api("/tipos-escala"), api("/codigos-plantao")]);
  listaUsuarios = u.usuarios;
  listaSetores = s.setores;
  listaTiposEscala = t.tiposEscala;
  listaCodigosPlantao = c.codigos;
}

async function renderFuncionarios(filtro = "") {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = `<div class="vazio">Carregando...</div>`;
  try {
    await carregarDados();
  } catch (e) {
    conteudo.innerHTML = `<div class="msg erro">Erro ao carregar: ${e.message}</div>`;
    return;
  }

  const podeCriarSetor = usuarioAtual.role === "admin";
  const termo = filtro.trim().toLowerCase();
  const filtrados = listaUsuarios.filter(u =>
    !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
  );

  const setorNome = (id) => listaSetores.find(s => s.id === id)?.nome || "—";
  const escalaNome = (id) => listaTiposEscala.find(t => t.id === id)?.nome || "—";

  conteudo.innerHTML = `
    <div class="cabecalho-lista">
      <h2>Funcionários (${listaUsuarios.length})</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <input id="busca" placeholder="Buscar por nome ou e-mail" value="${filtro}" />
        ${podeCriarSetor ? `<button class="secundario" id="btn-novo-setor">+ Setor</button>` : ""}
        <button id="btn-novo-func">+ Funcionário</button>
      </div>
    </div>
    <div class="linha-setores">
      <span class="linha-setores-label">Setores:</span>
      ${listaSetores.length === 0
        ? `<span class="linha-setores-vazio">nenhum setor cadastrado ainda</span>`
        : listaSetores.map(s => `<span class="setor-chip">${s.nome}</span>`).join("")}
    </div>
    <div id="feedback-setor"></div>
    ${filtrados.length === 0 ? `<div class="vazio">Nenhum funcionário encontrado.</div>` : `
    <table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Setor</th><th>Escala</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${filtrados.map(u => `
          <tr>
            <td>${u.nome}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td>${setorNome(u.setorId)}</td>
            <td>${escalaNome(u.tipoEscalaId)}</td>
            <td><span class="status-tag ${u.status}">${u.status}</span></td>
            <td class="acoes">
              <button class="secundario" data-editar="${u.id}">Editar</button>
              ${usuarioAtual.role === "admin" && u.id !== usuarioAtual.id ? `<button class="perigo" data-excluir="${u.id}">Excluir</button>` : ""}
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>`}
  `;

  document.getElementById("busca").oninput = (e) => renderFuncionariosLocal(e.target.value);
  document.getElementById("btn-novo-func").onclick = () => abrirModalFuncionario(null);
  const btnSetor = document.getElementById("btn-novo-setor");
  if (btnSetor) btnSetor.onclick = criarSetorPrompt;

  conteudo.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => abrirModalFuncionario(Number(b.dataset.editar));
  });
  conteudo.querySelectorAll("[data-excluir]").forEach(b => {
    b.onclick = () => excluirFuncionario(Number(b.dataset.excluir));
  });
}

// re-render so filtragem sem bater na API de novo
function renderFuncionariosLocal(filtro) {
  const termo = filtro.trim().toLowerCase();
  const conteudo = document.getElementById("conteudo");
  const filtrados = listaUsuarios.filter(u =>
    !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
  );
  const setorNome = (id) => listaSetores.find(s => s.id === id)?.nome || "—";
  const escalaNome = (id) => listaTiposEscala.find(t => t.id === id)?.nome || "—";
  const tbody = conteudo.querySelector("tbody");
  const tabela = conteudo.querySelector("table");
  const h2 = conteudo.querySelector("h2");
  if (h2) h2.textContent = `Funcionários (${listaUsuarios.length})`;

  if (filtrados.length === 0) {
    if (tabela) tabela.outerHTML = `<div class="vazio">Nenhum funcionário encontrado.</div>`;
    return;
  }
  if (!tabela) { renderFuncionarios(filtro); return; }
  tbody.innerHTML = filtrados.map(u => `
    <tr>
      <td>${u.nome}</td>
      <td>${u.email}</td>
      <td>${u.role}</td>
      <td>${setorNome(u.setorId)}</td>
      <td>${escalaNome(u.tipoEscalaId)}</td>
      <td><span class="status-tag ${u.status}">${u.status}</span></td>
      <td class="acoes">
        <button class="secundario" data-editar="${u.id}">Editar</button>
        ${usuarioAtual.role === "admin" && u.id !== usuarioAtual.id ? `<button class="perigo" data-excluir="${u.id}">Excluir</button>` : ""}
      </td>
    </tr>
  `).join("");
  conteudo.querySelectorAll("[data-editar]").forEach(b => {
    b.onclick = () => abrirModalFuncionario(Number(b.dataset.editar));
  });
  conteudo.querySelectorAll("[data-excluir]").forEach(b => {
    b.onclick = () => excluirFuncionario(Number(b.dataset.excluir));
  });
}

async function criarSetorPrompt() {
  const nome = prompt("Nome do novo setor:");
  if (!nome || !nome.trim()) return;
  try {
    await api("/setores", { method: "POST", body: JSON.stringify({ nome: nome.trim() }) });
    const filtroAtual = document.getElementById("busca") ? document.getElementById("busca").value : "";
    await renderFuncionarios(filtroAtual);
    const fb = document.getElementById("feedback-setor");
    if (fb) {
      fb.innerHTML = `<div class="msg ok">Setor "${nome.trim()}" criado.</div>`;
      setTimeout(() => { if (fb) fb.innerHTML = ""; }, 3000);
    }

async function salvarFuncionario(overlay, editando) {
  const btn = document.getElementById("m-salvar");
  const erroEl = document.getElementById("m-erro");
  btn.disabled = true;
  erroEl.innerHTML = "";
  try {
    const nome = document.getElementById("m-nome").value.trim();
    const email = document.getElementById("m-email").value.trim();
    const senhaEl = document.getElementById("m-senha");
    const senha = senhaEl ? senhaEl.value : "";
    const roleEl = document.getElementById("m-role");
    const setorEl = document.getElementById("m-setor");
    const tipoEscalaEl = document.getElementById("m-tipo-escala");
    const statusEl = document.getElementById("m-status");

    const body = { nome, email };
    if (senha) body.senha = senha;
    if (roleEl) body.role = roleEl.value;
    if (setorEl) body.setorId = setorEl.value ? Number(setorEl.value) : null;
    if (tipoEscalaEl) body.tipoEscalaId = tipoEscalaEl.value ? Number(tipoEscalaEl.value) : null;
    if (statusEl) body.status = statusEl.value;

    if (editando) {
      await api(`/usuarios/${editando.id}`, { method: "PUT", body: JSON.stringify(body) });

// Camada de provedores: hoje so' OCR gratuito. Quando a licenca for vendida/ativada,
// troca PROVEDOR_ATIVO para "ia" e implementa extrairComIA (chamada a uma API de visao).
// O resto da tela (revisao/edicao/importacao) nao muda.
const PROVEDORES_IMPORTACAO = {
  ocr: { rotulo: "OCR local (gratuito)", extrair: extrairComOCR },
  ia: { rotulo: "IA com visão (em breve)", extrair: extrairComIA },
};
let PROVEDOR_ATIVO = "ocr";

let textoOcrBruto = "";

async function extrairComOCR(file, onProgress) {
  if (typeof Tesseract === "undefined") throw new Error("Biblioteca de OCR não carregou. Verifique sua conexão e recarregue a página.");
  const { data } = await Tesseract.recognize(file, "por", {
    logger: (m) => { if (m.status === "recognizing text" && onProgress) onProgress(Math.round(m.progress * 100)); },
  });
  return data.text;
}

async function extrairComIA() {
  throw new Error("Importação por IA ainda não está ativada neste sistema.");
}

// Parser ingenuo: tenta achar data (dd/mm/aaaa ou aaaa-mm-dd) e horarios (HH:MM) em cada linha.
// O resto da linha vira o "nome detectado", que o usuario ajusta manualmente na tabela de revisao.
// Extrai só os nomes de cada linha do texto OCR. Critério rígido de propósito: uma
// linha só passa se TODAS as palavras forem puramente alfabéticas (nada de "1BAS17",
// "07AI" etc — grade/código de turno sempre mistura letra com número) e o total de
// palavras couber num nome de pessoa (1 a 3). Prefere descartar demais a deixar ruído.
function linhasParaNomes(texto) {
  return texto
    .split("\n")
    .map(l => l.trim())
    .filter(Boolean)
    .map(l => l.replace(/[|\[\]_]+/g, " ").replace(/\s+/g, " ").trim())
    .filter(l => {
      const palavras = l.split(" ").filter(Boolean);
      if (!palavras.length || palavras.length > 3) return false;
      return palavras.every(p => /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ.'-]*$/.test(p) && p.length >= 2);
    });
}

function encontrarUsuarioPorNome(nomeDetectado) {
  if (!nomeDetectado) return "";
  const termo = nomeDetectado.toLowerCase();
  const achado = listaUsuarios.find(u => termo.includes(u.nome.toLowerCase()) || u.nome.toLowerCase().includes(termo));
  return achado ? achado.id : "";
}

function slug(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "") || "func";
}

function gerarEmailTemp(nome) {
  const aleatorio = Math.random().toString(36).slice(2, 7);
  return `${slug(nome)}.${aleatorio}@pendente.pro-escala`;
}
function gerarSenhaTemp() {
  return Math.random().toString(36).slice(2, 10) + "Aa1!";
}

async function confirmarImportacao() {
  const btn = document.getElementById("btn-importar");
  const fb = document.getElementById("feedback-import");
  btn.disabled = true;
  fb.innerHTML = "";

  const validos = registrosRevisao.filter(r => r.nomeDetectado && (r.usuarioId || r.setorId));
  if (!validos.length) {
    fb.innerHTML = `<div class="msg erro">Preencha ao menos um nome com funcionário ou setor definido.</div>`;
    btn.disabled = false;
    return;
  }

  let criados = 0, atualizados = 0;
  const falhas = [];

  for (const r of validos) {
    try {
      if (r.usuarioId) {
        if (r.tipoEscalaId) {
          await api(`/usuarios/${r.usuarioId}`, { method: "PUT", body: JSON.stringify({ tipoEscalaId: Number(r.tipoEscalaId) }) });
          atualizados++;
        }
      } else {
        await api("/usuarios", { method: "POST", body: JSON.stringify({
          nome: r.nomeDetectado,
          email: gerarEmailTemp(r.nomeDetectado),
          senha: gerarSenhaTemp(),
          role: "usuario",
          setorId: Number(r.setorId),
          tipoEscalaId: r.tipoEscalaId ? Number(r.tipoEscalaId) : null,
        }) });
        criados++;
      }
    } catch (e) {
      falhas.push(`${r.nomeDetectado}: ${e.message}`);
    }
  }

  let html = "";
  if (criados) html += `<div class="msg ok">${criados} funcionário(s) novo(s) criado(s).</div>`;
  if (atualizados) html += `<div class="msg ok">${atualizados} padrão(ões) de escala atualizado(s).</div>`;
  if (falhas.length) html += `<div class="msg erro">${falhas.length} falha(s): ${falhas.join(", ")}</div>`;
  fb.innerHTML = html;
  btn.disabled = false;

  await carregarDados();
}

/* ---------- Gerar Escala a partir do padrão ---------- */
// Cada modelo de padrao tem uma logica de distribuicao diferente. Isso e' uma SUGESTAO --
// o gestor revisa/ajusta linha a linha antes de confirmar, igual na importacao por imagem.
function duracaoHoras(bloco) {
  const [hi, mi] = bloco.inicio.split(":").map(Number);
  const [hf, mf] = bloco.fim.split(":").map(Number);
  let minutos = (hf * 60 + mf) - (hi * 60 + mi);
  if (minutos <= 0) minutos += 24 * 60; // bloco cruza a meia-noite
  return minutos / 60;
}

function todasDatasEntre(iniStr, fimStr) {
  const datas = [];
  let d = new Date(iniStr + "T12:00:00");
  const fim = new Date(fimStr + "T12:00:00");
  while (d <= fim) {
    datas.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return datas;
}

function gerarLancamentos(tipoEscala, dataIni, dataFim, opcoes) {
  const blocos = tipoEscala.blocos;
  const dias = todasDatasEntre(dataIni, dataFim);
  const resultado = [];

  if (blocos.length === 6) {
    // Modelo rotativo 4h (ex: 24h semanais): um bloco por dia, 1 folga a cada 7 dias
    let idxBloco = opcoes.offsetBloco || 0;
    dias.forEach((data, i) => {
      if (i % 7 === (opcoes.diaFolgaIndex ?? 6)) return;
      const bloco = blocos[idxBloco % blocos.length];
      resultado.push({ data, horaInicio: bloco.inicio, horaFim: bloco.fim, tipo: "turno" });
      idxBloco++;
    });
  } else if (blocos.length === 1 && duracaoHoras(blocos[0]) >= 10) {
    // Modelo 12x36
    let trabalhaHoje = !opcoes.comecaFolgando;
    dias.forEach(data => {
      if (trabalhaHoje) resultado.push({ data, horaInicio: blocos[0].inicio, horaFim: blocos[0].fim, tipo: "12x36" });
      trabalhaHoje = !trabalhaHoje;
    });
  } else if (blocos.length === 2 && duracaoHoras(blocos[0]) >= 5) {
    // Modelo 30h (6h em dias uteis + 12h alternado no fim de semana)
    dias.forEach(data => {
      const dt = new Date(data + "T12:00:00");
      const dow = dt.getDay(); // 0=domingo, 6=sabado
      const semanaDoMes = Math.ceil(dt.getDate() / 7);
      const trabalhaSabado = opcoes.iniciaSabado ? (semanaDoMes % 2 === 1) : (semanaDoMes % 2 === 0);
      if (dow === 6) { if (trabalhaSabado) resultado.push({ data, horaInicio: "07:00", horaFim: "19:00", tipo: "12h fim de semana" }); }
      else if (dow === 0) { if (!trabalhaSabado) resultado.push({ data, horaInicio: "07:00", horaFim: "19:00", tipo: "12h fim de semana" }); }
      else { const bloco = blocos[opcoes.blocoSemanaIndex || 0]; resultado.push({ data, horaInicio: bloco.inicio, horaFim: bloco.fim, tipo: "turno" }); }
    });
  } else if (blocos.length === 2) {
    // Modelo 44h (2 blocos de 4h com intervalo, dias uteis)
    dias.forEach(data => {
      const dow = new Date(data + "T12:00:00").getDay();
      if (dow === 0 || dow === 6) return;
      blocos.forEach(b => resultado.push({ data, horaInicio: b.inicio, horaFim: b.fim, tipo: "turno" }));
    });
  }

  return resultado;
}

async function gerarSugestao() {
  const fb = document.getElementById("g-feedback");
  const usuarioId = Number(document.getElementById("g-funcionario").value);
  const mes = document.getElementById("g-mes").value; // AAAA-MM
  if (!usuarioId || !mes) { fb.innerHTML = `<div class="msg erro">Selecione o funcionário e o mês.</div>`; return; }

  const u = listaUsuarios.find(x => x.id === usuarioId);
  const tipo = listaTiposEscala.find(t => t.id === u.tipoEscalaId);
  const [ano, mesNum] = mes.split("-").map(Number);
  const dataIni = `${mes}-01`;
  const ultimoDia = new Date(ano, mesNum, 0).getDate();
  const dataFim = `${mes}-${String(ultimoDia).padStart(2, "0")}`;

  const opcoes = {
    diaFolgaIndex: document.getElementById("g-opt-folga") ? Number(document.getElementById("g-opt-folga").value) : undefined,
    comecaFolgando: document.getElementById("g-opt-folgando") ? document.getElementById("g-opt-folgando").checked : false,
    iniciaSabado: document.getElementById("g-opt-sabado") ? document.getElementById("g-opt-sabado").checked : false,
  };

  fb.innerHTML = `<div class="vazio">Verificando lançamentos existentes...</div>`;
  let existentes = [];
  try {
    const r = await api(`/escalas?userId=${usuarioId}&de=${dataIni}&ate=${dataFim}`);
    existentes = r.escalas;
  } catch (e) {
    fb.innerHTML = `<div class="msg erro">Erro ao verificar lançamentos: ${e.message}</div>`;
    return;
  }

  if (existentes.length > 0) {
    fb.innerHTML = `
      <div class="msg erro">${existentes.length} lançamento(s) já existem para ${u.nome} nesse mês.</div>
      <div style="margin-top:8px; display:flex; gap:10px;">
        <button class="secundario" id="g-cancelar-sub">Cancelar</button>
        <button class="perigo" id="g-substituir">Substituir os gerados por padrão (mantém os manuais/excel/ocr)</button>
      </div>
    `;
    document.getElementById("g-cancelar-sub").onclick = () => { fb.innerHTML = ""; };
    document.getElementById("g-substituir").onclick = async () => {
      try {
        await api(`/escalas?userId=${usuarioId}&de=${dataIni}&ate=${dataFim}`, { method: "DELETE" });
        montarRevisaoGeracao(usuarioId, tipo, dataIni, dataFim, opcoes);
      } catch (e) {
        fb.innerHTML = `<div class="msg erro">Erro ao substituir: ${e.message}</div>`;
      }
    };
    return;
  }

  fb.innerHTML = "";
  montarRevisaoGeracao(usuarioId, tipo, dataIni, dataFim, opcoes);
}

async function confirmarGeracao() {
  const btn = document.getElementById("g-confirmar");
  const fb = document.getElementById("g-feedback-confirmar");
  btn.disabled = true;
  try {
    const registros = registrosGeracao.map(r => ({ usuarioId: funcionarioGeracaoId, data: r.data, horaInicio: r.horaInicio, horaFim: r.horaFim, tipo: r.tipo }));
    const resultado = await api("/escalas/lote", { method: "POST", body: JSON.stringify({ registros, origem: "padrao" }) });
    let html = `<div class="msg ok">${resultado.inseridos} lançamento(s) salvos.</div>`;
    if (resultado.falhas && resultado.falhas.length) {
      html += `<div class="msg erro">${resultado.falhas.length} falha(s): ${resultado.falhas.map(f => `linha ${f.linha} (${f.motivo})`).join(", ")}</div>`;
    }
    fb.innerHTML = html;
  } catch (e) {
    fb.innerHTML = `<div class="msg erro">${e.message}</div>`;
  } finally {
    if (document.getElementById("g-confirmar")) btn.disabled = false;
  }
}

/* ---------- Importar Escala (Excel) ---------- */
const DICIONARIO_COLUNAS = {
  nome: ["nome", "funcionario", "colaborador", "servidor", "profissional", "empregado", "medico"],
  data: ["data", "dia", "date"],
  horaInicio: ["inicio", "entrada", "hora inicio", "hora de inicio", "ini", "start", "de"],
  horaFim: ["fim", "saida", "termino", "final", "hora fim", "hora de saida", "ate", "end"],
  tipo: ["tipo", "turno", "observacao", "obs", "plantao"],
  especialidade: ["especialidade", "setor", "area", "servico"],
  crm: ["crm", "registro", "cro", "conselho", "coren"],
};

function normalizarTexto(s) {
  return String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function serialExcelParaDataISO(serial) {
  const utcDias = Math.floor(serial - 25569);
  const data = new Date(utcDias * 86400 * 1000);
  return `${data.getUTCFullYear()}-${String(data.getUTCMonth() + 1).padStart(2, "0")}-${String(data.getUTCDate()).padStart(2, "0")}`;
}
function serialExcelParaHoraHHMM(serial) {
  const fracionario = serial - Math.floor(serial);
  const totalMin = Math.round(fracionario * 24 * 60);
  return `${String(Math.floor(totalMin / 60) % 24).padStart(2, "0")}:${String(totalMin % 60).padStart(2, "0")}`;
}

function parseCelulaData(valor) {
  if (valor === "" || valor === null || valor === undefined) return "";
  if (typeof valor === "number") return serialExcelParaDataISO(valor);
  const s = String(valor).trim();
  const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[0];
  const br = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (br) return `${br[3]}-${br[2].padStart(2, "0")}-${br[1].padStart(2, "0")}`;
  return "";
}
function parseCelulaHora(valor) {
  if (valor === "" || valor === null || valor === undefined) return "";
  if (typeof valor === "number") return serialExcelParaHoraHHMM(valor);
  const s = String(valor).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return `${m[1].padStart(2, "0")}:${m[2]}`;
  return "";
}

function detectarCabecalho(linhas) {
  let melhorLinha = 0, melhorPontuacao = -1;
  for (let i = 0; i < Math.min(linhas.length, 10); i++) {
    const celulas = linhas[i].map(normalizarTexto);
    let pontos = 0;
    celulas.forEach(c => {
      for (const campo in DICIONARIO_COLUNAS) {
        if (DICIONARIO_COLUNAS[campo].some(kw => c.includes(kw))) { pontos++; break; }
      }
    });
    if (pontos > melhorPontuacao) { melhorPontuacao = pontos; melhorLinha = i; }
  }
  return melhorLinha;
}

function detectarMapeamento(linhaCabecalho) {
  const mapa = {};
  linhaCabecalho.forEach((celula, i) => {
    const c = normalizarTexto(celula);
    for (const campo in DICIONARIO_COLUNAS) {
      if (DICIONARIO_COLUNAS[campo].some(kw => c.includes(kw))) { mapa[i] = campo; return; }
    }
    mapa[i] = "ignorar";
  });
  return mapa;
}

function processarArquivoExcel(file) {
  const dzTexto = document.getElementById("dropzone-excel-texto");
  dzTexto.textContent = `Lendo "${file.name}"...`;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: "array" });
      const primeiraAba = wb.Sheets[wb.SheetNames[0]];
      excelLinhas = XLSX.utils.sheet_to_json(primeiraAba, { header: 1, raw: true, defval: "" });
      if (!excelLinhas.length) throw new Error("Planilha vazia.");
      excelLinhaCabecalhoIdx = detectarCabecalho(excelLinhas);
      dzTexto.textContent = "📊 Clique para escolher outra planilha";
      if (formatoExcel === "grade") {
        excelMapeamentoGrade = detectarMapeamentoGrade(excelLinhas[excelLinhaCabecalhoIdx]);
        renderMapeamentoGrade();
      } else {
        excelMapeamento = detectarMapeamento(excelLinhas[excelLinhaCabecalhoIdx]);
        renderMapeamento();
      }
    } catch (err) {
      dzTexto.textContent = "📊 Clique para escolher a planilha (.xlsx, .xls, .csv)";
      document.getElementById("area-mapeamento").innerHTML = `<div class="msg erro">Erro ao ler planilha: ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Importar Excel — modo Grade (médico x dia, com códigos) ---------- */
let excelMapeamentoGrade = {};
let excelGradeMesAno = new Date().toISOString().slice(0, 7);
let gruposGrade = [];

function detectarMapeamentoGrade(linhaCabecalho) {
  const mapa = {};
  linhaCabecalho.forEach((celula, i) => {
    const c = normalizarTexto(celula);
    const numero = parseInt(String(celula).replace(/\D/g, ""), 10);
    if (DICIONARIO_COLUNAS.nome.some(kw => c.includes(kw))) { mapa[i] = { campo: "nome" }; return; }
    if (DICIONARIO_COLUNAS.especialidade.some(kw => c.includes(kw))) { mapa[i] = { campo: "especialidade" }; return; }
    if (DICIONARIO_COLUNAS.crm.some(kw => c.includes(kw))) { mapa[i] = { campo: "crm" }; return; }
    if (!isNaN(numero) && numero >= 1 && numero <= 31 && String(celula).trim() !== "") { mapa[i] = { campo: "dia", dia: numero }; return; }
    mapa[i] = { campo: "ignorar" };
  });
  return mapa;
}

  const linhaCab = excelLinhas[excelLinhaCabecalhoIdx];

    </select>
    <label>Mês/Ano dessa grade</label>
    <input type="month" id="grade-mes-ano" value="${excelGradeMesAno}" style="max-width:180px" />
    <div class="grade-mapeamento" id="grade-cols">
      ${linhaCab.map((celula, i) => {
        const m = excelMapeamentoGrade[i] || { campo: "ignorar" };
        return `
        <div class="col-mapeamento">
          <div class="amostra"><strong>${celula || "(coluna " + (i + 1) + ")"}</strong><br/>ex: ${linhaAmostra[i] ?? ""}</div>
          <select data-col="${i}">
            ${opcoesCampo.map(([v, l]) => `<option value="${v}" ${m.campo === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          ${m.campo === "dia" ? `<input type="number" min="1" max="31" data-dia-de="${i}" value="${m.dia}" style="margin-top:6px" />` : ""}
        </div>`;
      }).join("")}
    </div>
    <button id="btn-processar-grade">Processar planilha</button>
  `;

  document.getElementById("sel-linha-cab-grade").onchange = (e) => {
    excelLinhaCabecalhoIdx = Number(e.target.value);
    excelMapeamentoGrade = detectarMapeamentoGrade(excelLinhas[excelLinhaCabecalhoIdx]);
    renderMapeamentoGrade();
  };
  area.querySelectorAll("[data-col]").forEach(sel => {
    sel.onchange = () => {
      const i = Number(sel.dataset.col);
      excelMapeamentoGrade[i] = sel.value === "dia" ? { campo: "dia", dia: parseInt(String(linhaCab[i]).replace(/\D/g, ""), 10) || 1 } : { campo: sel.value };
      excelGradeMesAno = document.getElementById("grade-mes-ano").value || excelGradeMesAno;
      renderMapeamentoGrade();
    };
  });
  area.querySelectorAll("[data-dia-de]").forEach(inp => {
    inp.onchange = () => { excelMapeamentoGrade[Number(inp.dataset.diaDe)].dia = Number(inp.value); };
  });
  document.getElementById("btn-processar-grade").onclick = () => {
    excelGradeMesAno = document.getElementById("grade-mes-ano").value;
    processarLinhasGrade();
  };
}

function processarLinhasGrade() {
  const entradas = Object.entries(excelMapeamentoGrade);
  const colNome = entradas.find(([, m]) => m.campo === "nome")?.[0];
  const colEsp = entradas.find(([, m]) => m.campo === "especialidade")?.[0];
  const colCrm = entradas.find(([, m]) => m.campo === "crm")?.[0];
  const colsDia = entradas.filter(([, m]) => m.campo === "dia").map(([idx, m]) => ({ idx: Number(idx), dia: m.dia }));

  if (colNome === undefined) {
    document.getElementById("area-revisao-excel").innerHTML = `<div class="msg erro">Marque ao menos uma coluna como "Nome".</div>`;
    return;
  }
  if (!excelGradeMesAno) {
    document.getElementById("area-revisao-excel").innerHTML = `<div class="msg erro">Informe o mês/ano da grade.</div>`;
    return;
  }
  if (!colsDia.length) {
    document.getElementById("area-revisao-excel").innerHTML = `<div class="msg erro">Nenhuma coluna marcada como "Dia do mês".</div>`;
    return;
  }

  const linhasDados = excelLinhas.slice(excelLinhaCabecalhoIdx + 1);
  gruposGrade = linhasDados
    .map(l => {
      const nome = String(l[colNome] ?? "").trim();
      if (!nome) return null;
      const entradasDia = colsDia
        .map(({ idx, dia }) => {
          const valor = String(l[idx] ?? "").trim();
          if (!valor) return null;
          const siglaNorm = valor.toUpperCase().replace(/°/g, "º");
          const codigoInfo = listaCodigosPlantao.find(c => c.sigla.toUpperCase().replace(/°/g, "º") === siglaNorm);
          return {
            data: `${excelGradeMesAno}-${String(dia).padStart(2, "0")}`,
            codigo: valor,
            tipo: codigoInfo ? `${valor} — ${codigoInfo.descricao}` : valor,
            horaInicio: codigoInfo?.hora_inicio || "00:00",
            horaFim: codigoInfo?.hora_fim || "23:59",
            desconhecido: !codigoInfo,
          };
        })
        .filter(Boolean);
      if (!entradasDia.length) return null;
      return {
        nomeDetectado: nome,
        especialidade: colEsp !== undefined ? String(l[colEsp] ?? "").trim() : "",
        crm: colCrm !== undefined ? String(l[colCrm] ?? "").trim() : "",
        usuarioId: encontrarUsuarioPorNome(nome),
        setorId: usuarioAtual.role === "gestor_setor" ? usuarioAtual.setorId : (listaSetores[0]?.id || ""),
        entradas: entradasDia,
      };
    })
    .filter(Boolean);

  document.getElementById("area-sugestoes").innerHTML = "";
  renderRevisaoGrade();
}

function renderRevisaoGrade() {
  const area = document.getElementById("area-revisao-excel");
  if (!gruposGrade.length) {
    area.innerHTML = `<div class="vazio">Nenhum lançamento encontrado nas colunas marcadas como "Dia do mês".</div>`;

  }
  const totalLancamentos = gruposGrade.reduce((s, g) => s + g.entradas.length, 0);
  const totalDesconhecidos = gruposGrade.reduce((s, g) => s + g.entradas.filter(e => e.desconhecido).length, 0);
  const opcoesUsuarios = listaUsuarios.map(u => `<option value="${u.id}">${u.nome}</option>`).join("");
  const opcoesSetores = listaSetores.map(s => `<option value="${s.id}">${s.nome}</option>`).join("");

  area.innerHTML = `

    </div>
    ${totalDesconhecidos ? `<div class="msg erro">${totalDesconhecidos} lançamento(s) com código não cadastrado no dicionário — foram importados com o código literal, sem horário definido. Cadastre o significado em Configurações → Códigos de Plantão.</div>` : ""}
    <div id="grupos-grade"></div>
    <div id="feedback-import-excel" style="margin-top:14px;"></div>
    <div style="margin-top:14px;"><button id="btn-importar-grade">Importar tudo</button></div>
  `;

  const cont = document.getElementById("grupos-grade");
  gruposGrade.forEach((g, gi) => {
    const card = document.createElement("div");
    card.className = "grupo-grade-card";
    card.innerHTML = `
      <div class="grupo-grade-cabecalho">
        <strong>${g.nomeDetectado}</strong>
        <span class="grupo-grade-info">${g.especialidade || ""} ${g.crm ? "· " + g.crm : ""}</span>
        <select data-grupo-campo="usuarioId" data-gi="${gi}">
          <option value="">— criar novo funcionário —</option>
          ${opcoesUsuarios}
        </select>
        <select data-grupo-campo="setorId" data-gi="${gi}" style="${g.usuarioId ? "visibility:hidden" : ""}">
          <option value="">selecione o setor</option>
          ${opcoesSetores}
        </select>
        <span class="grupo-grade-info">${g.entradas.length} lançamento(s)</span>
      </div>
      <div class="chips-dias" data-chips="${gi}"></div>
    `;
    cont.appendChild(card);
    card.querySelector(`[data-grupo-campo="usuarioId"]`).value = g.usuarioId || "";
    card.querySelector(`[data-grupo-campo="setorId"]`).value = g.setorId || "";

    const chipsEl = card.querySelector(`[data-chips="${gi}"]`);
    const renderChips = () => {
      chipsEl.innerHTML = g.entradas.map((e, ei) => `
        <span class="chip-dia ${e.desconhecido ? "desconhecido" : ""}" title="${e.tipo}">
          ${e.data.slice(8)}/${e.data.slice(5, 7)}: ${e.codigo}
          <button data-remover-entrada="${ei}">×</button>
        </span>
      `).join("");
      chipsEl.querySelectorAll("[data-remover-entrada]").forEach(b => {
        b.onclick = () => {
          g.entradas.splice(Number(b.dataset.removerEntrada), 1);
          if (!g.entradas.length) { gruposGrade.splice(gi, 1); renderRevisaoGrade(); }
          else renderChips();
        };
      });
    };
    renderChips();

    card.querySelector(`[data-grupo-campo="usuarioId"]`).onchange = (e) => {
      g.usuarioId = e.target.value ? Number(e.target.value) : "";
      card.querySelector(`[data-grupo-campo="setorId"]`).style.visibility = g.usuarioId ? "hidden" : "visible";
    };
    card.querySelector(`[data-grupo-campo="setorId"]`).onchange = (e) => { g.setorId = e.target.value ? Number(e.target.value) : ""; };
  });

  document.getElementById("btn-importar-grade").onclick = confirmarImportacaoGrade;
}

async function confirmarImportacaoGrade() {
  const btn = document.getElementById("btn-importar-grade");
  const fb = document.getElementById("feedback-import-excel");
  btn.disabled = true;
  fb.innerHTML = "";

  const validos = gruposGrade.filter(g => g.usuarioId || g.setorId);
  if (!validos.length) {
    fb.innerHTML = `<div class="msg erro">Vincule ou defina o setor de ao menos um médico antes de importar.</div>`;
    btn.disabled = false;
    return;
  }

  const falhasCriacao = [];
  for (const g of validos) {
    if (!g.usuarioId) {
      try {
        const resp = await api("/usuarios", { method: "POST", body: JSON.stringify({
          nome: g.nomeDetectado, email: gerarEmailTemp(g.nomeDetectado), senha: gerarSenhaTemp(),
          role: "usuario", setorId: Number(g.setorId),
        }) });
        g.usuarioId = resp.usuario.id;
      } catch (e) {
        falhasCriacao.push(`${g.nomeDetectado}: ${e.message}`);
      }
    }
  }

  const registros = [];
  validos.filter(g => g.usuarioId).forEach(g => {
    g.entradas.forEach(e => registros.push({ usuarioId: g.usuarioId, data: e.data, horaInicio: e.horaInicio, horaFim: e.horaFim, tipo: e.tipo }));
  });

  try {
    const resultado = await api("/escalas/lote", { method: "POST", body: JSON.stringify({ registros, origem: "excel" }) });
    let html = `<div class="msg ok">${resultado.inseridos} lançamento(s) importado(s).</div>`;
    if (resultado.falhas && resultado.falhas.length) html += `<div class="msg erro">${resultado.falhas.length} falha(s): ${resultado.falhas.map(f => `linha ${f.linha} (${f.motivo})`).join(", ")}</div>`;
    if (falhasCriacao.length) html += `<div class="msg erro">${falhasCriacao.length} funcionário(s) não criado(s): ${falhasCriacao.join(", ")}</div>`;
    fb.innerHTML = html;
    await carregarDados();
  } catch (e) {
    fb.innerHTML = `<div class="msg erro">${e.message}</div>`;
  } finally {
    if (document.getElementById("btn-importar-grade")) btn.disabled = false;
  }
}

function duracaoHorasEntre(horaInicio, horaFim) {
  const [hi, mi] = horaInicio.split(":").map(Number);
  const [hf, mf] = horaFim.split(":").map(Number);
  let min = (hf * 60 + mf) - (hi * 60 + mi);
  if (min <= 0) min += 24 * 60;
  return min / 60;
}

function renderSugestoesPadrao(registrosImportados) {
  const area = document.getElementById("area-sugestoes");
  if (!listaTiposEscala.length || !registrosImportados.length) { area.innerHTML = ""; return; }

  const porUsuario = {};
  registrosImportados.forEach(r => {
    if (!porUsuario[r.usuarioId]) porUsuario[r.usuarioId] = [];
    porUsuario[r.usuarioId].push(r);
  });

  const datasTodas = registrosImportados.map(r => r.data).sort();
  const semanas = Math.max(1, Math.round((new Date(datasTodas[datasTodas.length - 1]) - new Date(datasTodas[0])) / (7 * 86400000)) + 1);

  const sugestoes = Object.entries(porUsuario).map(([usuarioId, regs]) => {
    const totalHoras = regs.reduce((s, r) => s + duracaoHorasEntre(r.horaInicio, r.horaFim), 0);
    const mediaSemanal = totalHoras / semanas;
    let melhor = listaTiposEscala[0], menorDiff = Infinity;
    listaTiposEscala.forEach(t => {
      const diff = Math.abs(t.cargaHorariaSemanal - mediaSemanal);
      if (diff < menorDiff) { menorDiff = diff; melhor = t; }
    });
    const usuario = listaUsuarios.find(u => u.id === Number(usuarioId));
    return { usuarioId: Number(usuarioId), nome: usuario?.nome || `#${usuarioId}`, mediaSemanal, tipoSugerido: melhor, jaTem: usuario?.tipoEscalaId };
  });

  area.innerHTML = `
    <div class="cabecalho-lista" style="margin-top:24px;">
      <h2 style="font-size:16px;">Sugestão de padrão de escala (pela quantidade importada)</h2>
    </div>
    ${sugestoes.map(s => `
      <div class="sugestao-card">
        <span><strong>${s.nome}</strong> — média de ${s.mediaSemanal.toFixed(1)}h/semana → sugestão: <strong>${s.tipoSugerido.nome}</strong>${s.jaTem === s.tipoSugerido.id ? " (já é esse)" : ""}</span>
        ${s.jaTem === s.tipoSugerido.id ? "" : `<button data-aplicar="${s.usuarioId}" data-tipo="${s.tipoSugerido.id}">Aplicar</button>`}
      </div>
    `).join("")}
  `;
  area.querySelectorAll("[data-aplicar]").forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        await api(`/usuarios/${b.dataset.aplicar}`, { method: "PUT", body: JSON.stringify({ tipoEscalaId: Number(b.dataset.tipo) }) });
        b.textContent = "Aplicado ✓";
      } catch (e) {
        b.disabled = false;
        alert("Erro: " + e.message);
      }
    };
  });
}

    const horaInicio = document.getElementById("novo-cod-inicio").value.trim();
    const horaFim = document.getElementById("novo-cod-fim").value.trim();
    if (!sigla || !descricao) { fb.innerHTML = `<div class="msg erro">Preencha sigla e descrição.</div>`; return; }
    try {
      await api("/codigos-plantao", { method: "POST", body: JSON.stringify({ sigla, descricao, horaInicio: horaInicio || null, horaFim: horaFim || null }) });
      await renderCodigosPlantao();
    } catch (e) {
      fb.innerHTML = `<div class="msg erro">${e.message}</div>`;
    }
  };
}

/* ---------- Visualizar / Imprimir Escala (função x dia = nome) ---------- */
async function renderVisualizarEscala() {
  const conteudo = document.getElementById("conteudo");
  if (!listaUsuarios.length) {
    try { await carregarDados(); } catch (e) {
      conteudo.innerHTML = `<div class="msg erro">Erro ao carregar dados: ${e.message}</div>`;
      return;
    }
  }
  const souGestorSetor = usuarioAtual.role === "gestor_setor";
  const hoje = new Date();
  const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}`;

  conteudo.innerHTML = `
    <div class="cabecalho-lista"><h2>Visualizar Escala</h2></div>
    <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
      ${!souGestorSetor ? `
      <div>
        <label>Setor</label>
        <select id="v-setor" style="max-width:220px">
          ${listaSetores.map(s => `<option value="${s.id}">${s.nome}</option>`).join("")}
        </select>
      </div>` : ""}
      <div>
        <label>Mês</label>
        <input type="month" id="v-mes" value="${mesAtual}" style="max-width:160px" />
      </div>
      <div><button id="v-carregar">Carregar</button></div>
      <div id="v-btn-imprimir-wrap"></div>
    </div>
    <div id="v-resultado" style="margin-top:20px;"></div>
  `;
  document.getElementById("v-carregar").onclick = carregarVisualizacaoEscala;
}

async function carregarVisualizacaoEscala() {
  const area = document.getElementById("v-resultado");
  const souGestorSetor = usuarioAtual.role === "gestor_setor";
  const setorId = souGestorSetor ? usuarioAtual.setorId : Number(document.getElementById("v-setor").value);
  const mes = document.getElementById("v-mes").value;
  if (!mes) { area.innerHTML = `<div class="msg erro">Escolha o mês.</div>`; return; }

  const [ano, mesNum] = mes.split("-").map(Number);
  const dataIni = `${mes}-01`;
  const ultimoDia = new Date(ano, mesNum, 0).getDate();
  const dataFim = `${mes}-${String(ultimoDia).padStart(2, "0")}`;

  area.innerHTML = `<div class="vazio">Carregando...</div>`;
  let escalas;
  try {
    const r = await api(`/escalas?setorId=${setorId}&de=${dataIni}&ate=${dataFim}`);
    escalas = r.escalas;
  } catch (e) {
    area.innerHTML = `<div class="msg erro">${e.message}</div>`;
    return;
  }

  if (!escalas.length) {
    area.innerHTML = `<div class="vazio">Nenhum lançamento encontrado nesse setor/mês.</div>`;
    document.getElementById("v-btn-imprimir-wrap").innerHTML = "";
    return;
  }

  // agrupa por funcao (campo "tipo", ou "Sem função definida" se vazio) x dia
  const funcoes = [...new Set(escalas.map(e => e.tipo && e.tipo.trim() ? e.tipo.trim() : "Sem função definida"))].sort();
  const nomeSetor = souGestorSetor ? (listaSetores.find(s => s.id === usuarioAtual.setorId)?.nome || "") : (listaSetores.find(s => s.id === setorId)?.nome || "");

  const grade = {}; // funcao -> { dia -> [nomes] }
  funcoes.forEach(f => { grade[f] = {}; });
  escalas.forEach(e => {
    const funcao = e.tipo && e.tipo.trim() ? e.tipo.trim() : "Sem função definida";
    const dia = Number(e.data.slice(8, 10));
    if (!grade[funcao][dia]) grade[funcao][dia] = [];
    grade[funcao][dia].push(e.usuario_nome);
  });

  const dias = Array.from({ length: ultimoDia }, (_, i) => i + 1);

  area.innerHTML = `
    <div id="area-imprimir-escala">
      <h3 style="margin:0 0 4px;">${appConfig.nome_instituicao || "Pro-Escala"} — ${nomeSetor}</h3>
      <p style="margin:0 0 14px; color:#94a3b8; font-size:13px;">Escala de ${mes}</p>
      <div class="wrapper-tabela-escala">
        <table class="tabela-funcao-dia">
          <thead><tr><th class="col-funcao">Função</th>${dias.map(d => `<th>${String(d).padStart(2, "0")}</th>`).join("")}</tr></thead>
          <tbody>
            ${funcoes.map(f => `
              <tr>
                <td class="col-funcao">${f}</td>
                ${dias.map(d => `<td>${(grade[f][d] || []).join(", ")}</td>`).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById("v-btn-imprimir-wrap").innerHTML = `<button id="v-imprimir">Imprimir / Exportar PDF</button>`;
  document.getElementById("v-imprimir").onclick = () => window.print();
}

iniciar();
</script>
</body>
